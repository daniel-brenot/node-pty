name: Build and Test

on:
  push:
    branches: [ "rust-port" ]

jobs:
  upload-to-npm:

    runs-on: ubuntu-latest
    needs: [
      build-linux,
      build-windows,
      build-macos,
    ]

    steps:

    - name: download linux x86_64 artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-build-86_64
        path: ${{ github.workspace }}/native

    - name: download linux arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-build-arm64
        path: ${{ github.workspace }}/native
    
    - name: download windows x86_64 artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build-x86_64
        path: ${{ github.workspace }}/native
    
    - name: download windows arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build-arm64
        path: ${{ github.workspace }}/native
    
    - name: download macos x86_64 artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build-x86_64
        path: ${{ github.workspace }}/native
    
    - name: download macos x86_64 artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build-arm64
        path: ${{ github.workspace }}/native
    
    - name: list files
      run: ls -la ${{ github.workspace }}/native

  build-linux:
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit