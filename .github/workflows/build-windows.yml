name: 'Build Windows'

on:
  workflow_call:

jobs:
  build-windows-x86_64:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >
          make
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-libgfortran
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-crt-git
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-winpthreads-git

    - name: Add MSYS2 MinGW64 to PATH
      shell: bash
      run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH
    
    - name: Set environment variables
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/mingw64/lib/pkgconfig" >> $GITHUB_ENV
        echo "TARGET=x86_64-pc-windows-gnu" >> $GITHUB_ENV
    
    - name: Setup rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
      
    - name: Set Node.js lts
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Verify Node.js installation
      run: node --version
    
    - name: Install yarn
      run: npm install -g yarn

    - name: Install dependencies
      run: yarn install
    
    - name: Build for platform
      run: yarn build
    
    - name: Test for platform
      run: yarn test

    - name: list files
      run: ls -la ${{ github.workspace }}/native/

    - name: upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-x86_64
        path: ${{ github.workspace }}/native/node-pty.win32-x64-msvc.node
        if-no-files-found: error
  
  build-windows-arm64:
    runs-on: windows-latest-arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
      
    - name: Set Node.js lts
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Verify Node.js installation
      run: node --version
    
    - name: Install yarn
      run: npm install -g yarn

    - name: Install dependencies
      run: yarn install
    
    - name: Build for platform
      run: yarn build
    
    - name: Test for platform
      run: yarn test

    - name: list files
      run: ls -la ${{ github.workspace }}/native/

    - name: upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-arm64
        path: ${{ github.workspace }}/native/node-pty.arm64-msvc.node
        if-no-files-found: error